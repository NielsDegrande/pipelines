[project]
name = "pipelines"
version = "0.1.0"
description = "Pipelines repository."
authors = [ { name = "Niels Degrande", email = "niels@degran.de" } ]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "coloredlogs==15.0.1",
    "google-cloud-storage==3.13.1",
    "mlflow==3.15.1",
    "pandas==2.3.3",
    "pandera==0.32.1",
    "psycopg2-binary==2.9.12",
    "python-box==7.4.1",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
]

[project.scripts]
pipes = "pipelines.__main__:main"

[dependency-groups]
dev = [
    "codespell",
    "ipython",
    "pandas-stubs",
    "pre-commit",
    "ruff",
    "sqlfluff",
    "types-PyYAML",
    "vulture",
]
test = [
    "pip-audit==2.10.1",
    "pre-commit==4.6.2",
    "pyright==1.1.411",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
timeout = "60"
addopts = [
    "--cov-report=html:test-reports/htmlcov",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml:test-reports/coverage.xml",
    "--cov=pipelines",
    "--junitxml=test-reports/junit/junit.xml",
    "--no-cov-on-fail",
    "--strict-markers",
    "--verbose",
    "-r sxX",
]
cache_dir = ".cache"
# MLflow has a dependency on pkg_resources which is deprecated.
filterwarnings = [ "error", "ignore::DeprecationWarning" ]
testpaths = "tests"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
    # Do not complain if tests do not hit defensive assertion code.
    "raise AssertionError",
    "raise NotImplementedError",

    # Do not complain if non-runnable code is not run.
    "if __name__ == .__main__.:",
]
ignore_errors = true

[tool.coverage.html]
directory = "coverage_html_report"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
    "COM812", # missing-trailing-comma not needed due to use of formatter.
    "CPY001", # missing-copyright-notice: this template does not use copyright headers.
    "D203",   # one-blank-line-before-class (incompatible with D211).
    "D213",   # multi-line-summary-second-line (incompatible with D212).
    # Do not complain about TODOs with missing author or link.
    "FIX002",
    "TD002",
    "TD003",
]

[tool.ruff.lint.flake8-type-checking]
# Pandera models resolve their annotations at runtime.
runtime-evaluated-base-classes = [
    "pandera.DataFrameModel",
    "pandera.pandas.DataFrameModel",
]

[tool.ruff.lint.per-file-ignores]
# Do not complain if __init__.py files have unused imports.
"__init__.py" = [ "F401" ]
# Do not complain if tests use the assert keyword.
"tests/*" = [ "S101" ]

[tool.uv]
default-groups = [  ]
# MLflow caps cryptography below 50, which blocks the fix for PYSEC-2026-3552.
# TODO: Remove this override once MLflow allows cryptography 50.
override-dependencies = [ "cryptography>=50.0.0" ]

[build-system]
requires = [ "hatchling>=1.31.0" ]
build-backend = "hatchling.build"
